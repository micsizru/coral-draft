<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coral Craft</title>
    <meta
      name="description"
      content="Coral Craft: Blok tabanlı içerik editörü. Paragraflarınızı etiketleyin, bloklara ayırın, JSON/DOCX olarak dışa aktarın."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coral: {
                bg: "#faf8f5",
                blue: "#0091d2",
                orange: "#ff7900",
                dark: "#1c2a38",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- docx indirmek için-->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

    <!-- FileSaver.js -->
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div id="app" class="min-h-screen flex flex-col">
      <!-- ═══════════ HEADER ═══════════ -->
      <header
        class="sticky top-[3px] z-40 bg-white/80 backdrop-blur-xl border-b border-slate-200/80"
      >
        <div
          class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <!-- Sidebar Aç/Kapa Butonu -->
            <button
              @click="sidebarOpen = !sidebarOpen"
              class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition border border-slate-200 shadow-sm"
              title="Taslaklar Paneli"
            >
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <div
              class="w-9 h-9 bg-gradient-to-br from-[#0091d2] via-[#ff7900] to-[#ffb100] rounded-xl flex items-center justify-center shadow-md shadow-orange-500/20"
            >
              <span class="text-white font-extrabold text-sm tracking-tight"
                >Coral</span
              >
            </div>
            <div>
              <h1 class="text-base font-bold text-slate-900 leading-tight">
                Coral Draft
              </h1>
              <p
                class="text-[0.65rem] text-slate-400 font-medium tracking-wide uppercase flex items-center gap-1.5"
              >
                <!-- Durum Göstergesi -->
                <span v-if="saving" class="text-indigo-600 font-bold">
                  • {{ t('saving') }}</span
                >
                <span
                  v-else-if="currentDocId"
                  class="text-emerald-600 font-bold"
                >
                  • {{ t('savedCloud') }}</span
                >
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2.5">
            <!-- SABİTLENMİŞ AKSİYON BUTONLARI -->
            <button
              class="btn btn-outline border-indigo-200 text-indigo-600 hover:bg-indigo-50 min-w-[130px] justify-center whitespace-nowrap"
              @click="createNewDoc"
            >
              {{ t('newDraft') }}
            </button>

            <button 
              class="btn btn-primary min-w-[135px] justify-center whitespace-nowrap" 
              @click="downloadDOCX"
            >
              {{ t('docxDownload') }}
            </button>

            <button 
              class="btn btn-dark min-w-[125px] justify-center whitespace-nowrap" 
              @click="downloadJSON"
            >
              {{ t('jsonDownload') }}
            </button>

            <!-- DİKEY AYIRAÇ ÇİZGİSİ -->
            <div class="h-5 w-[1px] bg-slate-200 mx-1"></div>

            <!-- EN SAĞDAKİ DİL SEÇİCİ ALANI -->
            <div class="flex items-center bg-slate-100/90 p-1 rounded-xl border border-slate-200/80 text-xs font-bold text-slate-600 shadow-inner">
              <button @click="setLang('tr')" :class="['px-2.5 py-1 rounded-lg transition-all cursor-pointer select-none', currentLang === 'tr' ? 'bg-white text-indigo-600 shadow-sm font-extrabold' : 'hover:text-slate-900 opacity-70']">TR</button>
              <button @click="setLang('ru')" :class="['px-2.5 py-1 rounded-lg transition-all cursor-pointer select-none', currentLang === 'ru' ? 'bg-white text-indigo-600 shadow-sm font-extrabold' : 'hover:text-slate-900 opacity-70']">RU</button>
              <button @click="setLang('en')" :class="['px-2.5 py-1 rounded-lg transition-all cursor-pointer select-none', currentLang === 'en' ? 'bg-white text-indigo-600 shadow-sm font-extrabold' : 'hover:text-slate-900 opacity-70']">EN</button>
            </div>
          </div>
      </header>

      <!-- ═══════════ MAIN CONTENT ═══════════ -->
      <!-- ═══════════ MAIN & SIDEBAR CONTAINER ═══════════ -->
      <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 items-start gap-6">
        <!-- ── SOL TASLAK PANELİ (SIDEBAR) ── -->
        <transition name="sidebar-slide">
          <aside
            v-if="sidebarOpen"
            class="fixed xl:absolute left-4 top-20 xl:top-8 z-50 xl:z-20 w-64 bg-white/95 backdrop-blur-md border border-slate-200/80 p-4 rounded-2xl shadow-2xl xl:shadow-sm flex flex-col gap-3 max-h-[calc(100vh-100px)]"
          >
            <div
              class="flex items-center justify-between border-b border-slate-100 pb-3"
            >
              <h2
                class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >
                {{ t('myDrafts') }}
              </h2>
              <span class="text-xs text-slate-400 font-medium"
                >{{ docList.length }} {{ t('documents') }}</span
              >
            </div>

            <div class="flex-1 overflow-y-auto space-y-1.5 pr-1">
              <div
                v-for="doc in docList"
                :key="doc.id"
                @click="loadDoc(doc.id)"
                :class="['p-2.5 rounded-xl text-sm cursor-pointer transition flex items-center justify-between group border', 
                         currentDocId === doc.id ? 'bg-indigo-50/80 text-indigo-700 font-semibold border-indigo-200' : 'text-slate-600 hover:bg-slate-50 border-transparent hover:border-slate-200']"
              >
                <span class="truncate pr-2 text-xs"
                  >📄 {{ doc.title || 'İsimsiz Taslak' }}</span
                >
                <button
                  @click.stop="deleteDoc(doc.id)"
                  class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 font-bold px-1 transition"
                  title="Taslağı Sil"
                >
                  ×
                </button>
              </div>

              <div
                v-if="docList.length === 0"
                class="text-xs text-slate-400 italic text-center py-6"
              >
                {{ t('noDrafts') }}
              </div>
            </div>
          </aside>
        </transition>
        <main
          class="max-w-5xl w-full mx-auto px-6 pt-8 pb-20 flex-1 flex flex-col gap-8"
        >
          <!-- ── SEO FORM ── -->
          <section
            class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 w-full max-w-[720px] mx-auto"
          >
            <div class="flex items-center gap-2 mb-4">
              <h2
                class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >
                {{ t('seoInfo') }}
              </h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-xs font-bold text-slate-500 uppercase mb-1"
                  >{{ t('h1Title') }}</label
                >
                <input
                  v-model="seo.h1"
                  type="text"
                  class="input-field"
                  placeholder="Ana başlığı girin..."
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-slate-500 uppercase mb-1"
                  >{{ t('metaTitle') }}</label
                >
                <input
                  v-model="seo.metaTitle"
                  type="text"
                  class="input-field"
                  placeholder="Meta title..."
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-slate-500 uppercase mb-1"
                  >{{ t('url') }}</label
                >
                <input
                  v-model="seo.url"
                  type="text"
                  class="input-field"
                  placeholder="https://..."
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-slate-500 uppercase mb-1"
                  >{{ t('metaDesc') }}</label
                >
                <input
                  v-model="seo.metaDescription"
                  type="text"
                  class="input-field"
                  placeholder="Meta description..."
                />
              </div>
            </div>
          </section>

          <!-- ── DOCUMENT BLOCKS CANVAS ── -->
          <div class="w-full flex flex-col items-center gap-10">
            <!-- BLOCKS LOOP -->
            <div
              v-for="(block, bIndex) in blocks"
              :key="block.id"
              class="w-full max-w-[720px] bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-visible relative p-8 sm:p-10"
            >
              <!-- BLOCK HEADER BAR (Clean inline title) -->
              <div
                class="flex items-center justify-between pb-6 mb-6 border-b border-slate-100"
              >
                <div class="flex items-center gap-2">
                  <input
                    v-model="block.name"
                    type="text"
                    class="bg-transparent text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none px-1 py-0.5 transition-all"
                    :placeholder="t('blockName')"
                  />
                </div>

                <button
                  v-if="blocks.length > 1"
                  @click="deleteBlock(bIndex)"
                  class="px-2.5 py-1 rounded-lg text-xs font-semibold text-rose-500 bg-rose-50 hover:bg-rose-100 hover:text-rose-700 border border-rose-100/80 transition-all flex items-center gap-1.5 active:scale-95 cursor-pointer shadow-sm"
                >
                  <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                  </svg>
                  {{ t('deleteBlock') }}
                </button>
              </div>

              <!-- LINES LIST (Word-like continuous writing canvas) -->
              <div class="space-y-4">
                <div
                  v-for="(line, lIndex) in block.lines"
                  :key="line.id"
                  class="relative flex items-start group"
                >
                  <!-- LEFT BUTTON OUTSIDE THE TEXT CANVAS MARGIN -->
                  <div
                    class="absolute right-full mr-4 top-1 flex items-center z-30"
                  >
                    <!-- DROPDOWN POPOVER (SLIDES LEFT) -->
                    <transition name="dropdown-menu-left">
                      <div
                        v-if="activeDropdown === `${bIndex}_${lIndex}`"
                        class="absolute right-full mr-2 top-1/2 -translate-y-1/2 bg-white rounded-xl shadow-xl border border-slate-200/90 p-1.5 flex items-center gap-1 z-40 whitespace-nowrap"
                      >
                        <button
                          v-for="type in types"
                          :key="type.value"
                          @click="setLineType(bIndex, lIndex, type.value)"
                          :class="['text-xs font-bold px-2.5 py-1 rounded transition-all duration-150', 
                                                 line.type === type.value ? type.activeClass : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100']"
                        >
                          {{ type.abbr }}
                        </button>
                      </div>
                    </transition>

                    <!-- ROUND TYPE SELECTOR BUTTON -->
                    <button
                      @click.stop="toggleDropdown(bIndex, lIndex)"
                      :class="['w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border transition-all duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-indigo-500 cursor-pointer select-none', 
                                         getDropdownBtnClass(line.type)]"
                      :title="'Etiket: ' + (types.find(t => t.value === line.type)?.label)"
                    >
                      {{ types.find(t => t.value === line.type)?.abbr }}
                    </button>
                  </div>

                  <!-- CONTINUOUS TEXTAREA (NO INNER BORDERS / NO INPUT BOX LOOK) -->
                  <div class="flex-1 min-w-0">
                    <textarea
                      v-model="line.content"
                      @keydown.enter.prevent="handleEnter(bIndex, lIndex, $event)"
                      @keydown.backspace="handleBackspace(bIndex, lIndex, $event)"
                      @keydown.up="focusPrev(bIndex, lIndex)"
                      @keydown.down="focusNext(bIndex, lIndex)"
                      :ref="el => { if (el) setLineRef(bIndex, lIndex, el) }"
                      rows="1"
                      class="w-full bg-transparent border-0 outline-none resize-none focus:ring-0 px-0 py-1 m-0 placeholder:text-slate-300 placeholder:italic transition-all duration-200 block"
                      :class="getLineClass(line.type)"
                      :placeholder="t('placeholderText')"
                      @input="adjustHeight($event.target)"
                    ></textarea>

                    <!-- LINK TESTER -->
                    <div
                      v-if="line.type === 'image_link' && line.content.trim()"
                      class="mt-1 flex justify-start"
                    >
                      <a
                        :href="line.content.trim()"
                        target="_blank"
                        class="text-xs text-blue-600 hover:underline inline-flex items-center gap-1 font-medium"
                      >
                        {{ t('testLink') }}
                      </a>
                    </div>
                  </div>

                  <!-- RIGHT DELETE BUTTON OUTSIDE THE TEXT CANVAS MARGIN -->
                  <div class="absolute left-full ml-4 top-1 flex items-center">
                    <button
                      @click="deleteLine(bIndex, lIndex)"
                      class="opacity-0 group-hover:opacity-100 w-7 h-7 rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all duration-150"
                      :title="t('deleteLine')"
                    >
                      <svg
                        width="14"
                        height="14"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        viewBox="0 0 24 24"
                      >
                        <polyline points="3 6 5 6 21 6" />
                        <path
                          d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <!-- ADD LINE (+) AT BOTTOM OF BLOCK -->
              <div class="flex justify-center pt-6">
                <button
                  @click="addNewLine(bIndex, block.lines.length)"
                  class="w-7 h-7 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 border border-slate-200 flex items-center justify-center text-sm font-bold transition-all shadow-sm active:scale-95"
                  title="Bu bloğa yeni satır ekle"
                >
                  +
                </button>
              </div>
            </div>

            <!-- "YENİ BLOK EKLE" BUTTON -->
            <button
              class="btn btn-outline border-indigo-200 text-indigo-600 hover:bg-indigo-50 shadow-sm py-2.5 px-6"
              @click="addNewBlock"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                viewBox="0 0 24 24"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              {{ t('addBlock') }}
            </button>
          </div>
        </main>
      </div>
      <!-- ═══════════ TOAST ═══════════ -->
      <div :class="['toast-notification', { hidden: !toastVisible }]">
        {{ toastMessage }}
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
     VUE 3 APPLICATION
     ═══════════════════════════════════════════════════════════ -->
    <!-- Main JS Application Module -->
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
